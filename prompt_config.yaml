default:
  prompt:
    art_style: "Detailed line art in a modern japanese anime style, emphasizing delicate textures on fabric and hair. The lighting is gentle and neutral natural light, creating a serene and elegant atmosphere with soft shading."
    gender: "Female"
    age: "20 years old"
    eye: "Warm dark brown, reflecting soft ambient light"
    hair: "Neatly tied up in an elegant traditional style with modern touches, black, adorned with exquisite kanzashi (Japanese hair ornaments) featuring cherry blossoms and tassels. Slight loose strands frame her face due to movement."
