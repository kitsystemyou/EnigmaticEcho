    expression: "Laughing happily with a wide, open-mouthed smile, eyes sparkling with joy and excitement. Radiating pure happiness."
    gaze: "Looking excitedly towards the viewer or slightly upwards, full of energy."
    clothing: "Elegant traditional silk kimono with sophisticated floral patterns (such as cherry blossoms, peonies, and wisteria) in soft pastel shades like pale pink, light blue, and cream. Focusing on the detailed texture of the fabric, embroidery, and a beautifully tied obi sash. The kimono sleeves and hem are flowing dynamically around her due to the jump."
    composition: "An anime-style illustration with a strong emphasis on cheerful energy and traditional Japanese aesthetics. The character has idealized features rendered with delicate lines. The setting is meticulously detailed with elements like aged wooden shrine architecture, stone lanterns, and sacred trees, contributing to a bright and playful mood. The character’s elaborate kimono and accessories reflect a refined bishoujo illustration style set in a traditional context. Overall, the image combines elements of modern anime art with the graceful beauty of traditional Japanese culture creating an energetic and charming visual."
    scene: "A lively moment in a peaceful Shinto shrine (jinja) grounds bathed in soft, dappled clear sunlight filtering through ancient trees. The main shrine building, a stone pathway, and many falling cherry blossom petals swirling around her due to her movement are carefully depicted, creating a joyful and dynamic atmosphere. Soft, faint lines and a light color palette to create a dreamlike appearance. Realistic images that look like real life photos are prohibited."
